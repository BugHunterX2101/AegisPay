# Render Blueprint for AegisPay: one free Postgres and one free web service that runs the API and the worker together.
# Secrets are never stored here: every `sync: false` value is asked for in the Render dashboard when the Blueprint is
# applied. (scripts/render-deploy.mjs does the same job through the Render API for an already-created service.)
databases:
  - name: aegispay-db
    plan: free
    databaseName: aegispay
    user: aegispay

services:
  - type: web
    name: aegispay
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    # One free instance runs both processes; if either exits, `wait -n` ends the service and Render restarts it.
    startCommand: pnpm --filter @aegis/worker start & pnpm --filter @aegis/api start & wait -n
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: aegispay-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JUDGE_MODE
        value: "true"
      # PayPal: sandbox only. The code refuses any other host.
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WRITES_ENABLED
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Set after the first deploy, from scripts/paypal-webhook.mjs (the webhook points at <APP_URL>/webhooks/paypal).
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The public URL Render assigns, used for PayPal return links.
      - key: APP_URL
        sync: false
      # A hosted language model (either one) and the live product catalog.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
