name: nightly

# Proves the hosted demo is still alive: live self-check (database, PayPal sandbox, webhook, Channel3), audit-chain
# verification, a sync of every open dispute, and the browser end-to-end tests. Set the repository variable APP_URL to the deployed API.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Nightly health run
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: pnpm nightly
      - name: Browser end-to-end tests against the hosted demo
        # Read-only against the demo: no PayPal hold is approved and the demo is never reset.
        env:
          E2E_BASE_URL: ${{ vars.APP_URL }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
